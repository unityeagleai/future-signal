<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Future Signal</title>
  <meta name="description" content="Daily transmissions from your future self">
  <meta name="theme-color" content="#0A0E1F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Future Signal">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="noise"></div>
  <div id="app">
    <div id="screen-container"></div>
    <nav id="bottom-nav" class="hidden">
      <button class="nav-btn active" data-screen="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <span>Today</span>
      </button>
      <button class="nav-btn" data-screen="archive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="4" rx="1"/><path d="M4 7v13a1 1 0 001 1h14a1 1 0 001-1V7"/><path d="M9 12h6M9 16h4"/></svg>
        <span>Archive</span>
      </button>
      <button class="nav-btn" data-screen="journal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16v16H4z" rx="1"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <span>Journal</span>
      </button>
      <button class="nav-btn" data-screen="me">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <span>Me</span>
      </button>
    </nav>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
